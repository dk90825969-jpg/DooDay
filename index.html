
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111318">
<title>DooDay</title>
<link rel="manifest" href="./manifest.json">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    background: #111318;
    color: #f4f4f5;
    font-family: Arial, sans-serif;
    padding: 35px 18px;
}

.app {
    max-width: 520px;
    margin: auto;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 38px;
}

.logo {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -1px;
}

.logo span { color: #a78bfa; }

.date {
    color: #999ba7;
    font-size: 13px;
}

h1 {
    font-size: 30px;
    margin-bottom: 8px;
}

.subtitle {
    color: #999ba7;
    margin-bottom: 30px;
    font-size: 14px;
}

.card {
    background: #1c1f27;
    border: 1px solid #2c303b;
    border-radius: 16px;
    padding: 22px;
}

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 17px;
}

.card-header h2 {
    font-size: 17px;
    margin: 0;
}

.progress-text {
    color: #a78bfa;
    font-size: 13px;
}

.progress {
    height: 6px;
    background: #343744;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 22px;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: #a78bfa;
    transition: width .2s;
}

#taskList {
    display: flex;
    flex-direction: column;
    gap: 13px;
}

.task {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
}

.task input {
    appearance: none;
    width: 21px;
    height: 21px;
    min-width: 21px;
    border: 2px solid #686b7a;
    border-radius: 7px;
    cursor: pointer;
}

.task input:checked {
    background: #a78bfa;
    border-color: #a78bfa;
}

.task input:checked::after {
    content: "✓";
    display: block;
    color: #171421;
    font-size: 15px;
    font-weight: bold;
    text-align: center;
    line-height: 17px;
}

.task-name {
    flex: 1;
    overflow-wrap: anywhere;
    font-size: 14px;
}

.task.done .task-name {
    text-decoration: line-through;
    color: #777987;
}

.delete {
    background: none;
    border: none;
    color: #777987;
    cursor: pointer;
    font-size: 19px;
    padding: 4px 7px;
}

.delete:hover { color: #f87171; }

.add-task {
    display: flex;
    gap: 9px;
    margin-top: 24px;
}

.add-task input {
    flex: 1;
    min-width: 0;
    background: #292d38;
    border: 1px solid #3b3f4c;
    border-radius: 9px;
    padding: 13px;
    color: white;
    outline: none;
    font-size: 14px;
}

.add-task input:focus {
    border-color: #a78bfa;
}

.add-task button {
    background: #a78bfa;
    color: #171421;
    border: none;
    border-radius: 9px;
    padding: 0 17px;
    font-weight: bold;
    cursor: pointer;
}

.add-task button:hover { background: #b9a3ff; }

.footer {
    text-align: center;
    color: #777987;
    font-size: 12px;
    margin-top: 25px;
}

@media (max-width: 400px) {
    body { padding: 25px 12px; }
    .card { padding: 17px; }
}
</style>
</head>

<body>
<div class="app">

    <header>
        <div class="logo">Doo<span>Day.</span></div>
        <div class="date" id="date"></div>
    </header>

    <h1>Good morning! ☀️</h1>
    <div class="subtitle">Let's get things done, one at a time.</div>

    <section class="card">
        <div class="card-header">
            <h2>My checklist</h2>
            <div class="progress-text" id="progressText">0/0 done</div>
        </div>

        <div class="progress">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div id="taskList"></div>

        <form class="add-task" id="addForm">
            <input
                type="text"
                id="taskInput"
                placeholder="Add a new task..."
                maxlength="100"
                autocomplete="off"
            >
            <button type="submit">+ Add</button>
        </form>
    </section>

    <div class="footer">
        One thing at a time. You've got this.
    </div>

</div>

<script>
const STORAGE_KEY = "dooday-data";
const today = new Date().toLocaleDateString("en-CA");

document.getElementById("date").textContent =
    new Date().toLocaleDateString("en-US", {
        weekday: "long",
        month: "short",
        day: "numeric"
    });

let saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");

let tasks = saved?.tasks || [
    { name: "Brush my teeth", done: false },
    { name: "Get dressed", done: false },
    { name: "Grab my keys", done: false },
    { name: "Take my wallet", done: false }
];

// Reset completed tasks when a new day begins.
if (saved && saved.date !== today) {
    tasks.forEach(task => task.done = false);
}

function saveTasks() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
        date: today,
        tasks: tasks
    }));
}

function renderTasks() {
    const list = document.getElementById("taskList");
    list.innerHTML = "";

    tasks.forEach((task, index) => {
        const row = document.createElement("div");
        row.className = "task" + (task.done ? " done" : "");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.done;
        checkbox.addEventListener("change", () => {
            tasks[index].done = checkbox.checked;
            saveTasks();
            renderTasks();
        });

        const name = document.createElement("span");
        name.className = "task-name";
        name.textContent = task.name;

        const remove = document.createElement("button");
        remove.className = "delete";
        remove.textContent = "×";
        remove.title = "Delete task";
        remove.addEventListener("click", () => {
            tasks.splice(index, 1);
            saveTasks();
            renderTasks();
        });

        row.append(checkbox, name, remove);
        list.appendChild(row);
    });

    const completed = tasks.filter(task => task.done).length;
    const total = tasks.length;
    const percentage = total ? completed / total * 100 : 0;

    document.getElementById("progressText").textContent =
        `${completed}/${total} done`;

    document.getElementById("progressFill").style.width =
        percentage + "%";
}

document.getElementById("addForm").addEventListener("submit", event => {
    event.preventDefault();

    const input = document.getElementById("taskInput");
    const name = input.value.trim();

    if (!name) return;

    tasks.push({ name: name, done: false });
    saveTasks();
    renderTasks();

    input.value = "";
    input.focus();
});

saveTasks();
renderTasks();
</script>
<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js")
        .then(() => console.log("DooDay is ready!"))
        .catch(error => console.error(error));
</script>
</body>
</html>
