
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111318">
<title>DooDay</title>
<link rel="manifest" href="./manifest.json">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    background: #111318;
    color: #f4f4f5;
    font-family: Arial, sans-serif;
    padding: 35px 18px;
}

.app {
    max-width: 520px;
    margin: auto;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 38px;
}

.logo {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -1px;
}

.logo span { color: #a78bfa; }

.date {
    color: #999ba7;
    font-size: 13px;
}

h1 {
    font-size: 30px;
    margin-bottom: 8px;
}

.subtitle {
    color: #999ba7;
    margin-bottom: 30px;
    font-size: 14px;
}

.card {
    background: #1c1f27;
    border: 1px solid #2c303b;
    border-radius: 16px;
    padding: 22px;
}

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 17px;
}

.card-header h2 {
    font-size: 17px;
    margin: 0;
}

.progress-text {
    color: #a78bfa;
    font-size: 13px;
}

.progress {
    height: 6px;
    background: #343744;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 15px;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: #a78bfa;
    transition: width .2s;
}

.streak {
    color: #fbbf24;
    font-size: 13px;
    margin-bottom: 22px;
}

#taskList {
    display: flex;
    flex-direction: column;
    gap: 13px;
}

.task {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    padding: 3px;
    border-radius: 8px;
    transition: background .15s;
}

.task.dragging {
    opacity: .4;
}

.task.drag-over {
    background: #343044;
}

.task input {
    appearance: none;
    width: 21px;
    height: 21px;
    min-width: 21px;
    border: 2px solid #686b7a;
    border-radius: 7px;
    cursor: pointer;
}

.task input:checked {
    background: #a78bfa;
    border-color: #a78bfa;
}

.task input:checked::after {
    content: "✓";
    display: block;
    color: #171421;
    font-size: 15px;
    font-weight: bold;
    text-align: center;
    line-height: 17px;
}

.task-name {
    flex: 1;
    overflow-wrap: anywhere;
    font-size: 14px;
}

.task.done .task-name {
    text-decoration: line-through;
    color: #777987;
}

.delete, .move {
    background: none;
    border: none;
    color: #777987;
    cursor: pointer;
    font-size: 17px;
    padding: 5px;
}

.delete:hover { color: #f87171; }
.move:hover { color: #a78bfa; }

.task-actions {
    display: flex;
    align-items: center;
    gap: 2px;
}

.actions {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.actions button, #undoButton {
    flex: 1;
    padding: 11px 8px;
    border-radius: 9px;
    border: 1px solid #3b3f4c;
    background: #292d38;
    color: #f4f4f5;
    cursor: pointer;
    font-size: 13px;
}

#uncheckAll:hover { border-color: #a78bfa; }

#deleteAll:hover {
    border-color: #f87171;
    color: #f87171;
}

#undoButton {
    width: 100%;
    margin-bottom: 18px;
}

#undoButton:disabled {
    opacity: .35;
    cursor: not-allowed;
}

.add-task {
    display: flex;
    gap: 9px;
    margin-top: 24px;
}

.add-task input {
    flex: 1;
    min-width: 0;
    background: #292d38;
    border: 1px solid #3b3f4c;
    border-radius: 9px;
    padding: 13px;
    color: white;
    outline: none;
    font-size: 14px;
}

.add-task input:focus { border-color: #a78bfa; }

.add-task button {
    background: #a78bfa;
    color: #171421;
    border: none;
    border-radius: 9px;
    padding: 0 17px;
    font-weight: bold;
    cursor: pointer;
}

.add-task button:hover { background: #b9a3ff; }

.celebration {
    display: none;
    text-align: center;
    padding: 15px;
    margin-bottom: 18px;
    border-radius: 12px;
    background: #302944;
    color: #d8c8ff;
    animation: pop .35s ease;
}

.celebration.show { display: block; }

.celebration strong {
    display: block;
    font-size: 17px;
    margin-bottom: 5px;
}

.celebration span {
    font-size: 13px;
    color: #b8a9d9;
}

@keyframes pop {
    from { transform: scale(.92); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

.footer {
    text-align: center;
    color: #777987;
    font-size: 12px;
    margin-top: 25px;
}

@media (max-width: 400px) {
    body { padding: 25px 12px; }
    .card { padding: 17px; }
}
</style>
</head>

<body>
<div class="app">

    <header>
        <div class="logo">Doo<span>Day.</span></div>
        <div class="date" id="date"></div>
    </header>

    <h1>Good morning! ☀️</h1>
    <div class="subtitle">Let's get things done, one at a time.</div>

    <section class="card">
        <div class="card-header">
            <h2>My checklist</h2>
            <div class="progress-text" id="progressText">0/0 done</div>
        </div>

        <div class="progress">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="streak" id="streak">🔥 0 day streak</div>

        <div class="celebration" id="celebration">
            <strong>🎉 Checklist complete!</strong>
            <span>You've got everything done. Great job!</span>
        </div>

        <div class="actions">
            <button id="uncheckAll">↻ Uncheck all</button>
            <button id="deleteAll">♲ Delete all</button>
        </div>

        <button id="undoButton" disabled>↶ Undo last deletion</button>

        <div id="taskList"></div>

        <form class="add-task" id="addForm">
            <input
                type="text"
                id="taskInput"
                placeholder="Add a new task..."
                maxlength="100"
                autocomplete="off"
            >
            <button type="submit">+ Add</button>
        </form>
    </section>

    <div class="footer">
        One thing at a time. You've got this.
    </div>

</div>

<script>
const STORAGE_KEY = "dooday-data";

function getLocalDate() {
    const d = new Date();
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
}

function updateDate() {
    document.getElementById("date").textContent =
        new Date().toLocaleDateString("en-US", {
            weekday: "long",
            month: "short",
            day: "numeric"
        });
}

let today = getLocalDate();
updateDate();

let saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");

let tasks = saved?.tasks || [
    { name: "Brush my teeth", done: false },
    { name: "Get dressed", done: false },
    { name: "Grab my keys", done: false },
    { name: "Take my wallet", done: false }
];

let completedDates = saved?.completedDates || [];
let undoAction = null;
let draggedIndex = null;

function saveTasks() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
        date: today,
        tasks: tasks,
        completedDates: completedDates
    }));
}

function wasCompletedToday() {
    return completedDates.includes(today);
}

function recordCompletion() {
    if (tasks.length === 0) return;

    const allDone = tasks.every(task => task.done);

    if (allDone && !wasCompletedToday()) {
        completedDates.push(today);
        saveTasks();

        document.getElementById("celebration").classList.add("show");
    }
}

function getStreak() {
    const dates = new Set(completedDates);
    let date = new Date();

    if (!dates.has(today)) {
        date.setDate(date.getDate() - 1);
    }

    let streak = 0;

    while (true) {
        const key = [
            date.getFullYear(),
            String(date.getMonth() + 1).padStart(2, "0"),
            String(date.getDate()).padStart(2, "0")
        ].join("-");

        if (!dates.has(key)) break;

        streak++;
        date.setDate(date.getDate() - 1);
    }

    return streak;
}

function updateStreak() {
    const count = getStreak();
    document.getElementById("streak").textContent =
        `🔥 ${count} day${count === 1 ? "" : "s"} streak`;
}

function checkNewDay() {
    const newDate = getLocalDate();

    if (newDate !== today) {
        today = newDate;
        tasks.forEach(task => task.done = false);

        updateDate();
        document.getElementById("celebration").classList.remove("show");

        saveTasks();
        renderTasks();
    }
}

if (saved && saved.date !== today) {
    tasks.forEach(task => task.done = false);
}

function updateUndoButton() {
    document.getElementById("undoButton").disabled = !undoAction;
}

function renderTasks() {
    const list = document.getElementById("taskList");
    list.innerHTML = "";

    tasks.forEach((task, index) => {
        const row = document.createElement("div");
        row.className = "task" + (task.done ? " done" : "");
        row.draggable = true;

        row.addEventListener("dragstart", () => {
            draggedIndex = index;
            row.classList.add("dragging");
        });

        row.addEventListener("dragend", () => {
            row.classList.remove("dragging");
            document.querySelectorAll(".task").forEach(el =>
                el.classList.remove("drag-over")
            );
        });

        row.addEventListener("dragover", event => {
            event.preventDefault();
            row.classList.add("drag-over");
        });

        row.addEventListener("dragleave", () => {
            row.classList.remove("drag-over");
        });

        row.addEventListener("drop", event => {
            event.preventDefault();
            row.classList.remove("drag-over");

            if (draggedIndex === null || draggedIndex === index) return;

            const movedTask = tasks.splice(draggedIndex, 1)[0];
            tasks.splice(index, 0, movedTask);

            draggedIndex = null;
            saveTasks();
            renderTasks();
        });

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.done;

        checkbox.addEventListener("change", () => {
            tasks[index].done = checkbox.checked;

            recordCompletion();
            saveTasks();
            renderTasks();
        });

        const name = document.createElement("span");
        name.className = "task-name";
        name.textContent = task.name;

        const taskActions = document.createElement("div");
        taskActions.className = "task-actions";

        const up = document.createElement("button");
        up.className = "move";
        up.textContent = "↑";
        up.title = "Move up";
        up.disabled = index === 0;

        up.addEventListener("click", () => {
            if (index === 0) return;
            [tasks[index - 1], tasks[index]] =
                [tasks[index], tasks[index - 1]];
            saveTasks();
            renderTasks();
        });

        const down = document.createElement("button");
        down.className = "move";
        down.textContent = "↓";
        down.title = "Move down";
        down.disabled = index === tasks.length - 1;

        down.addEventListener("click", () => {
            if (index === tasks.length - 1) return;
            [tasks[index + 1], tasks[index]] =
                [tasks[index], tasks[index + 1]];
            saveTasks();
            renderTasks();
        });

        const remove = document.createElement("button");
        remove.className = "delete";
        remove.textContent = "×";
        remove.title = "Delete task";

        remove.addEventListener("click", () => {
            undoAction = {
                items: [{ task: tasks[index], index: index }]
            };

            tasks.splice(index, 1);
            saveTasks();
            updateUndoButton();
            renderTasks();
        });

        taskActions.append(up, down, remove);
        row.append(checkbox, name, taskActions);
        list.appendChild(row);
    });

    const completed = tasks.filter(task => task.done).length;
    const total = tasks.length;

    document.getElementById("progressText").textContent =
        `${completed}/${total} done`;

    document.getElementById("progressFill").style.width =
        (total ? completed / total * 100 : 0) + "%";

    updateStreak();
    updateUndoButton();
}

// Undo the last deletion
document.getElementById("undoButton").addEventListener("click", () => {
    if (!undoAction) return;

    undoAction.items
        .sort((a, b) => a.index - b.index)
        .forEach(item => {
            tasks.splice(item.index, 0, item.task);
        });

    undoAction = null;
    saveTasks();
    renderTasks();
});

// Uncheck everything
document.getElementById("uncheckAll").addEventListener("click", () => {
    tasks.forEach(task => task.done = false);
    document.getElementById("celebration").classList.remove("show");
    saveTasks();
    renderTasks();
});

// Delete everything
document.getElementById("deleteAll").addEventListener("click", () => {
    if (!tasks.length) return;

    if (confirm("Are you sure you want to delete all tasks?")) {
        undoAction = {
            items: tasks.map((task, index) => ({
                task: task,
                index: index
            }))
        };

        tasks = [];
        saveTasks();
        renderTasks();
    }
});

// Add a new task
document.getElementById("addForm").addEventListener("submit", event => {
    event.preventDefault();

    const input = document.getElementById("taskInput");
    const name = input.value.trim();

    if (!name) return;

    tasks.push({ name: name, done: false });
    saveTasks();
    renderTasks();

    input.value = "";
    input.focus();
});

// Check when the app returns to the foreground
document.addEventListener("visibilitychange", () => {
    if (!document.hidden) checkNewDay();
});

window.addEventListener("focus", checkNewDay);

setInterval(checkNewDay, 30000);

saveTasks();
renderTasks();
</script>

<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js")
        .then(() => console.log("DooDay is ready!"))
        .catch(error => console.error(error));
}
</script>

</body>
</html>
